# ============================================================================
# Zensical configuration for the llm-preamble documentation site.
#
# Theme: classic (Material for MkDocs look-and-feel)
# Docs:  https://zensical.org/docs/setup/basics/
# ============================================================================

[project]

site_name = "LLM Preamble Experiments"
site_description = "Empirical investigation of whether coding-agent preambles measurably change LLM code quality."
site_author = "Chris Santiago"
site_url = "https://chris-santiago.github.io/llm-preamble/"
docs_dir = "docs"
site_dir = "site"

copyright = """
Copyright &copy; 2026 Chris Santiago
"""

# Link the site back to the GitHub repo. With `content.action.edit` enabled
# (below), each page gets an "edit" pencil that points to the underlying .md
# on the configured branch.
repo_url = "https://github.com/chris-santiago/llm-preamble"
repo_name = "chris-santiago/llm-preamble"
edit_uri = "edit/main/docs/"

# Top-level navigation. Order matches the spec:
#   Home / Findings / How-to / Reference / Explanation / Methodology / Reproduce / About
# Each section enumerates its full page list so the sidebar shows every page
# directly (paired with `navigation.expand` + `navigation.indexes` below, the
# section index serves as both landing AND header for the expanded list).
nav = [
    { "Home" = "index.md" },

    { "Findings" = [
        { "Overview"  = "findings/index.md" },
        { "Finding 1" = "findings/1-load-bearing-channel.md" },
        { "Finding 2" = "findings/2-overlap-not-expertness.md" },
        { "Finding 3" = "findings/3-bare-enumeration.md" },
        { "Finding 4" = "findings/4-no-alignment-vs-capability-split.md" },
        { "Finding 5" = "findings/5-static-analysis-misses.md" },
    ] },

    { "How-to" = [
        { "Overview"             = "how-to/index.md" },
        { "Design a preamble"    = "how-to/design-a-preamble.md" },
        { "Interpret CQS-craft"  = "how-to/interpret-cqs-craft.md" },
        { "A/B test a preamble"  = "how-to/ab-test-a-preamble.md" },
        { "Extend the rubric"    = "how-to/extend-the-rubric.md" },
        { "Add a condition"      = "how-to/add-a-condition.md" },
        { "Run a confound probe" = "how-to/run-a-confound-probe.md" },
    ] },

    { "Reference" = [
        { "Overview"            = "reference/index.md" },
        { "Preambles"           = "reference/preambles.md" },
        { "Rubric"              = "reference/rubric.md" },
        { "Models"              = "reference/models.md" },
        { "Tasks"               = "reference/tasks.md" },
        { "Generation protocol" = "reference/generation-protocol.md" },
        { "Judge protocol"      = "reference/judge-protocol.md" },
        { "Statistical methods" = "reference/statistical-methods.md" },
        { "Results schema"      = "reference/results-schema.md" },
        { "Glossary"            = "reference/glossary.md" },
    ] },

    { "Explanation" = [
        { "Overview"                       = "explanation/index.md" },
        { "Attention allocation"           = "explanation/attention-allocation-mechanism.md" },
        { "Load-bearing channel"           = "explanation/load-bearing-channel-reframe.md" },
        { "Enumeration vs demonstration"   = "explanation/enumeration-vs-demonstration.md" },
        { "System vs user channel"         = "explanation/system-vs-user-channel.md" },
        { "Why static metrics fail"        = "explanation/why-static-metrics-fail.md" },
        { "v1 → v2 instrument correction"  = "explanation/v1-vs-v2-instrument-correction.md" },
        { "Confound probes"                = "explanation/confound-probes-identification.md" },
        { "Related work"                   = "explanation/related-work.md" },
    ] },

    { "Methodology" = [
        { "Overview"           = "methodology/index.md" },
        { "Pre-registration"   = "methodology/pre-registration.md" },
        { "ml-lab workflow"    = "methodology/ml-lab-workflow.md" },
        { "Investigation logs" = "methodology/investigation-logs.md" },
        { "Amendments"         = "methodology/amendments.md" },
        { "Limitations"        = "methodology/limitations.md" },
    ] },

    { "Reproduce" = [
        { "Overview"        = "reproduce/index.md" },
        { "Quickstart"      = "reproduce/quickstart.md" },
        { "Main run"        = "reproduce/main-run.md" },
        { "Analysis"        = "reproduce/analysis.md" },
        { "Confound probes" = "reproduce/confound-probes.md" },
    ] },

    { "About" = [
        { "Overview"    = "about/index.md" },
        { "v3 idea"     = "about/v3-idea.md" },
        { "Attribution" = "about/attribution.md" },
    ] },
]

# Load the palette override CSS (warm off-white + deep blue accent adapted
# from astro-portfolio).
extra_css = [ "stylesheets/extra.css" ]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]

# Use the Material-for-MkDocs-style "classic" variant.
variant = "modern"

language = "en"

features = [
    # Announcement bar dismissal.
    "announce.dismiss",

    # Per-page edit / view-source buttons (pointing at the .md file on GitHub).
    # NOTE: these link to the page's own Markdown source. Zensical's classic
    # theme does NOT natively support a per-page link to an *arbitrary* .py
    # file. To render a "source: path/to/script.py" link, we'd need a custom
    # template override (project.theme.custom_dir + overrides/partials/...)
    # that reads a front-matter key like `source_path:` and emits an <a> to
    # `{repo_url}/blob/main/{source_path}`.
    # TODO(task-N): add overrides/partials/source.html and wire it into the
    # content header so pages can declare `source_path:` in front matter.
    "content.action.edit",
    "content.action.view",

    # Code-block UX.
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",

    # Footnotes as inline tooltips.
    "content.footnote.tooltips",

    # Linked content tabs (e.g., "Python" tabs all switch together).
    "content.tabs.link",

    # Hoverable link tooltips.
    "content.tooltips",

    # Navigation behavior.
    "navigation.expand",             # expand all sidebar groups by default so child pages are visible
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",            # instant nav (XHR, no full reload)
    "navigation.instant.prefetch",   # prefetch on hover
    "navigation.path",               # breadcrumbs above page title
    "navigation.sections",
    "navigation.tabs",               # top-level sections as tabs (required for the 8-tab nav)
    "navigation.tabs.sticky",        # keep tabs visible while scrolling
    "navigation.top",                # back-to-top button
    "navigation.tracking",           # update URL with active anchor

    # Search.
    "search.highlight",
    # NOTE: Zensical's built-in search is enabled by default; "instant search"
    # in the spec is satisfied by the always-on client-side search plus
    # `navigation.instant` above. There is no separate `search.instant`
    # feature flag in Zensical 0.0.43.
]

[project.theme.icon]
edit = "material/pencil"
view = "material/eye"

# ----------------------------------------------------------------------------
# Color palette: light + dark with a toggle.
# ----------------------------------------------------------------------------
[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ----------------------------------------------------------------------------
# Markdown extensions.
#
# Everything we need is enabled here:
#   - admonition + pymdownx.details : notes / warnings / tips (collapsible too)
#   - pymdownx.arithmatex (generic) : MathJax-style math equations
#   - pymdownx.superfences + mermaid fence : Mermaid diagram rendering
#   - pymdownx.highlight + inlinehilite : code blocks + inline code colors
#   - pymdownx.tabbed : content tabs
#   - pymdownx.tasklist : GitHub-style task lists
#   - toc with permalink : anchor links on headings
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.arithmatex]
# `generic = true` emits a format the classic theme's MathJax loader picks up.
generic = true

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]   # collapsible admonitions

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.superfences]
# Register the `mermaid` fence so ```mermaid blocks render as diagrams.
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]
